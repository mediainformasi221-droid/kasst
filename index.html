<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--navy:#002855;--navy2:#0b3a68;--gold:#c8a64b;--bg:#f3f6fa;--text:#172b4d;--muted:#64748b;--line:#e2e8f0;--white:#fff;--green:#16845b;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700}button.secondary{background:#e8eef5;color:var(--navy)}button.danger{background:#b42318}button:disabled{opacity:.5;cursor:not-allowed}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#002855,#0b3a68)}.login{background:white;border-radius:18px;padding:30px;width:min(420px,100%);box-shadow:0 20px 55px #00152f55}.brand{font-weight:800;font-size:22px;color:var(--navy)}.sub{color:var(--muted);font-size:13px;line-height:1.5}
    .field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff;color:var(--text)}.field textarea{min-height:75px;resize:vertical}
    .app{display:none;min-height:100vh}.topbar{background:var(--navy);color:white;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar strong{font-size:18px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:transparent;color:#334155;font-weight:600}.nav button.active,.nav button:hover{background:#eaf0f7;color:var(--navy)}.main{padding:22px;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.page-head h1{font-size:24px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 6px #0f172a05}.card .label{font-size:12px;color:var(--muted);margin-bottom:8px}.card .value{font-size:23px;font-weight:800;overflow-wrap:anywhere}.card .value.small{font-size:18px}.panel{margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#475569;font-size:12px}td.num{text-align:right;font-variant-numeric:tabular-nums}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff2cc;color:#805b00;font-size:11px;font-weight:800}.status.ok{background:#dff7e9;color:#12633f}.status.no{background:#fee4e2;color:#9f1c13}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:11px 13px;border-radius:9px;background:#eef5ff;color:#17477c;margin:10px 0;font-size:13px}.error{background:#fee4e2;color:#9f1c13}.success{background:#dff7e9;color:#12633f}.hidden{display:none!important}.pill{font-size:11px;background:#edf2f7;border-radius:99px;padding:4px 8px}.empty{padding:24px;text-align:center;color:var(--muted)}.table-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.table-tools input{max-width:300px;border:1px solid #cbd5e1;border-radius:8px;padding:9px}.footnote{font-size:12px;color:var(--muted);line-height:1.6}
    @media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.main{padding:14px}.topbar{padding:13px 15px}}
    @media(max-width:560px){.cards,.grid2,.formgrid{grid-template-columns:1fr}.page-head{flex-direction:column}.card .value{font-size:21px}.topbar strong{font-size:15px}}
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login">
      <div class="brand">KAS-ST</div><p class="sub">Sistem Informasi Kas Hasil Surat Tugas</p>
      <div id="loginMessage"></div>
      <form id="loginForm">
        <div class="field"><label>Username</label><input id="username" autocomplete="username" required></div>
        <div class="field"><label>Kata sandi</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button style="width:100%;margin-top:8px" type="submit">Masuk</button>
      </form>
      <p class="footnote">Akses dibatasi berdasarkan peran pengguna. Hubungi Admin jika akun belum tersedia.</p>
    </div>
  </div>

  <div id="appView" class="app">
    <header class="topbar"><strong id="appTitle">KAS-ST | Kas Hasil Surat Tugas</strong><div class="actions"><span id="userLabel" class="pill"></span><button class="secondary" onclick="refreshData()">Perbarui</button><button class="secondary" onclick="doLogout()">Keluar</button></div></header>
    <div class="layout">
      <aside class="sidebar"><nav id="nav" class="nav"></nav></aside>
      <main id="main" class="main"><div class="empty">Memuat data...</div></main>
    </div>
  </div>
  <div id="globalMessage" style="position:fixed;bottom:15px;right:15px;z-index:20;max-width:min(420px,calc(100% - 30px))"></div>

<script>
  let token = sessionStorage.getItem('kasst_token') || '';
  let currentUser = null, data = null, currentPage = 'dashboard';
  const money = n => 'Rp' + Number(n||0).toLocaleString('id-ID');
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});
  function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args))}
  function toast(msg,type='success'){const el=document.getElementById('globalMessage');el.innerHTML=`<div class="notice ${type==='error'?'error':'success'}">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML='',4500)}
  function setLoginMessage(msg,error=true){document.getElementById('loginMessage').innerHTML=msg?`<div class="notice ${error?'error':'success'}">${esc(msg)}</div>`:''}
  document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await call('login',document.getElementById('username').value,document.getElementById('password').value);token=r.token;sessionStorage.setItem('kasst_token',token);currentUser=r.user;await loadApp()}catch(err){setLoginMessage(err.message)}});
  async function loadApp(){try{data=await call('getInitialData',token);currentUser=data.user;document.getElementById('loginView').style.display='none';document.getElementById('appView').style.display='block';document.getElementById('appTitle').textContent=data.appName||'KAS-ST';document.getElementById('userLabel').textContent=(currentUser.displayName||currentUser.username)+' · '+currentUser.role;buildNav();if(currentUser.mustChangePassword){currentPage='password';render()}else{render()}}catch(e){sessionStorage.removeItem('kasst_token');token='';document.getElementById('appView').style.display='none';document.getElementById('loginView').style.display='grid';setLoginMessage(e.message)}}
  async function refreshData(){try{data=await call('getInitialData',token);buildNav();render();toast('Data berhasil diperbarui.')}catch(e){toast(e.message,'error')}}
  async function doLogout(){try{await call('logout',token)}catch(e){}sessionStorage.removeItem('kasst_token');token='';data=null;currentUser=null;document.getElementById('appView').style.display='none';document.getElementById('loginView').style.display='grid';document.getElementById('password').value='';}
  function buildNav(){const admin=currentUser.role==='ADMIN';const items=[['dashboard','Dashboard'],['sts','Data Surat Tugas'],['transactions','Arus Kas'],['password','Ganti Kata Sandi']];if(admin)items.push(['newst','Input ST'],['newtx','Catat Transaksi'],['settings','Pengaturan'],['users','Pengguna'],['audit','Audit Aktivitas']);document.getElementById('nav').innerHTML=items.map(([id,label])=>`<button class="${currentPage===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}
  function go(p){if(currentUser.mustChangePassword&&p!=='password'){toast('Silakan ganti kata sandi awal terlebih dahulu.','error');p='password'}currentPage=p;buildNav();render()}
  function pageHead(title,sub=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${sub}</div></div></div>`}
  function card(label,value,small=false){return `<div class="card"><div class="label">${label}</div><div class="value ${small?'small':''}">${value}</div></div>`}
  function render(){if(!data)return;const m=document.getElementById('main');if(currentUser.mustChangePassword&&currentPage!=='password')currentPage='password';buildNav();
    if(currentPage==='dashboard')m.innerHTML=dashboard();
    else if(currentPage==='sts')m.innerHTML=stPage();
    else if(currentPage==='transactions')m.innerHTML=txPage();
    else if(currentPage==='newst')m.innerHTML=stForm();
    else if(currentPage==='newtx')m.innerHTML=txForm();
    else if(currentPage==='settings')m.innerHTML=settingsPage();
    else if(currentPage==='users')m.innerHTML=usersPage();
    else if(currentPage==='audit')m.innerHTML=auditPage();
    else if(currentPage==='password')m.innerHTML=passwordPage();
  }
  function dashboard(){const s=data.stats;const pending=data.transactions.filter(t=>t.status==='MENUNGGU_VERIFIKASI');return `${pageHead('Dashboard','Ringkasan posisi kas dan aktivitas Surat Tugas')}
    <div class="cards">${card('Saldo Kas Resmi',money(s.saldo))}${card('Total Penerimaan',money(s.penerimaan))}${card('Total Pengeluaran',money(s.pengeluaran))}${card('Total Alokasi ST',money(s.totalAlokasi))}${card('ST Dalam Kota',s.stDalam+' ST',true)}${card('ST Luar Kota',s.stLuar+' ST',true)}${card('Menunggu Verifikasi',s.menunggu+' transaksi',true)}${card('Jumlah Surat Tugas',s.jumlahST+' ST',true)}</div>
    <div class="panel"><h2>Aktivitas Arus Kas Terbaru</h2>${txTable(data.transactions.slice(0,10),currentUser.role==='ADMIN')}</div>
    <div class="panel"><h2>Catatan Pembayaran</h2><div class="grid2"><div><b>${esc(data.settings.rekening_bank||'BRI')}</b><p class="muted">Nama: ${esc(data.settings.rekening_nama||'Belum diatur')}<br>Rekening: ${esc(data.settings.rekening_nomor||'Belum diatur')}</p></div><div><b>QRIS</b><p class="muted">Penerima: ${esc(data.settings.qris_nama||'Belum diatur')}</p>${data.settings.qris_url?`<a href="${esc(data.settings.qris_url)}" target="_blank" rel="noopener">Lihat QRIS</a>`:'<span class="muted">QRIS belum dikonfigurasi</span>'}</div></div></div>`}
  function statusBadge(s){const cls=s==='DISETUJUI'||s==='BERHASIL'?'ok':s==='DITOLAK'||s==='DIBATALKAN'?'no':'';return `<span class="status ${cls}">${esc(s||'-')}</span>`}
  function txTable(rows,admin){if(!rows.length)return '<div class="empty">Belum ada transaksi.</div>';return `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Masuk</th><th>Keluar</th><th>Metode</th><th>Status</th>${admin?'<th>Aksi</th>':''}</tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.tanggal)}</td><td>${esc(t.kategori)}</td><td>${esc(t.keterangan)}</td><td class="num">${money(t.kasMasuk)}</td><td class="num">${money(t.kasKeluar)}</td><td>${esc(t.metodePembayaran)}</td><td>${statusBadge(t.status)}</td>${admin?`<td>${t.status==='MENUNGGU_VERIFIKASI'?`<div class="actions"><button onclick="validateTx('${esc(t.id)}','DISETUJUI')">Setujui</button><button class="danger" onclick="validateTx('${esc(t.id)}','DITOLAK')">Tolak</button></div>`:'-'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
  function stPage(){const rows=data.sts;return `${pageHead('Data Surat Tugas','Daftar ST dan alokasi kas per penugasan')}<div class="panel"><div class="table-tools"><input id="stSearch" placeholder="Cari nomor ST / uraian..." oninput="filterTable('stTable',this.value)">${currentUser.role==='ADMIN'?'<button onclick="go(&quot;newst&quot;)">+ Input ST</button>':''}</div><div class="table-wrap"><table id="stTable"><thead><tr><th>Nomor ST</th><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th>Tarif</th><th>Alokasi</th><th>Metode</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.nomorST)}</td><td>${esc(r.tanggalST)}</td><td>${esc(r.uraian)}</td><td>${r.jenisST==='LUAR_KOTA'?'Luar Kota':'Dalam Kota'}</td><td>${money(r.tarif)}</td><td>${money(r.nominalAlokasi)}</td><td>${esc(r.metodePembayaran)}</td><td>${statusBadge(r.statusPembayaran)}</td></tr>`).join('')}</tbody></table></div></div>`}
  function txPage(){return `${pageHead('Arus Kas','Penerimaan dan pengeluaran yang sudah maupun belum disahkan')}<div class="panel"><div class="table-tools"><input placeholder="Cari kategori / keterangan..." oninput="filterTable('txTable',this.value)">${currentUser.role==='ADMIN'?'<button onclick="go(&quot;newtx&quot;)">+ Catat Transaksi</button>':''}</div><div id="txTableWrap">${txTable(data.transactions,currentUser.role==='ADMIN')}</div></div>`}
  function stForm(){return `${pageHead('Input Surat Tugas','Alokasi kas dihitung otomatis berdasarkan jenis ST')}<div class="panel"><form id="stForm" onsubmit="submitST(event)"><div class="formgrid">
    <div class="field"><label>Nomor Surat Tugas *</label><input name="nomorST" required></div><div class="field"><label>Jenis ST *</label><select name="jenisST" required><option value="DALAM_KOTA">Dalam Kota — ${money(data.settings.tarif_dalam_kota)}</option><option value="LUAR_KOTA">Luar Kota — ${money(data.settings.tarif_luar_kota)}</option></select></div>
    <div class="field"><label>Tanggal ST</label><input type="date" name="tanggalST"></div><div class="field"><label>Tanggal Pelaksanaan</label><input type="date" name="tanggalPelaksanaan"></div>
    <div class="field full"><label>Uraian Kegiatan</label><input name="uraian"></div><div class="field"><label>Metode Pembayaran</label><select name="metodePembayaran"><option>BRI</option><option>QRIS</option></select></div><div class="field"><label>Referensi Pembayaran (opsional)</label><input name="referensiPembayaran"></div>
    <div class="field full"><label>Catatan</label><textarea name="catatan"></textarea></div></div><div class="actions"><button type="submit">Simpan ST</button><button type="button" class="secondary" onclick="go('sts')">Batal</button></div></form></div>`}
  function txForm(){return `${pageHead('Catat Transaksi','Transaksi baru masuk ke saldo resmi setelah disahkan')}<div class="panel"><form id="txForm" onsubmit="submitTx(event)"><div class="formgrid">
    <div class="field"><label>Jenis Transaksi *</label><select name="jenisTransaksi" required><option value="PENERIMAAN">Penerimaan Kas</option><option value="PENGELUARAN">Pengeluaran Kas</option></select></div><div class="field"><label>Tanggal *</label><input type="date" name="tanggal" value="${today()}" required></div>
    <div class="field"><label>Kategori *</label><input name="kategori" placeholder="Contoh: Alokasi ST Luar Kota" required></div><div class="field"><label>Nominal (Rp) *</label><input name="nominal" type="number" min="1" step="1" required></div>
    <div class="field"><label>Metode Pembayaran</label><select name="metodePembayaran"><option>BRI</option><option>QRIS</option><option>TUNAI</option><option>LAINNYA</option></select></div><div class="field"><label>Referensi ST / Pembayaran</label><input name="referensiST" placeholder="Nomor ST atau referensi"></div>
    <div class="field full"><label>Keterangan *</label><textarea name="keterangan" required></textarea></div><div class="field full"><label>URL Bukti Transaksi (opsional)</label><input name="buktiUrl" type="url" placeholder="https://..."></div><div class="field full"><label>Catatan</label><textarea name="catatan"></textarea></div>
    </div><div class="notice">Pastikan nominal dan bukti transaksi benar. Transaksi akan menunggu verifikasi Admin.</div><div class="actions"><button type="submit">Simpan Transaksi</button><button type="button" class="secondary" onclick="go('transactions')">Batal</button></div></form></div>`}
  function settingsPage(){const s=data.settings;return `${pageHead('Pengaturan','Hanya Admin yang dapat mengubah tarif dan informasi pembayaran')}<div class="panel"><h2>Tarif Alokasi Kas ST</h2><form id="settingsForm" onsubmit="submitSettings(event)"><div class="formgrid">
    <div class="field"><label>Tarif ST Luar Kota (Rp)</label><input type="number" min="0" name="tarif_luar_kota" value="${esc(s.tarif_luar_kota)}" required></div><div class="field"><label>Tarif ST Dalam Kota (Rp)</label><input type="number" min="0" name="tarif_dalam_kota" value="${esc(s.tarif_dalam_kota)}" required></div>
    <div class="field"><label>Nama Bank</label><input name="rekening_bank" value="${esc(s.rekening_bank)}"></div><div class="field"><label>Nama Pemilik Rekening</label><input name="rekening_nama" value="${esc(s.rekening_nama)}"></div><div class="field"><label>Nomor Rekening</label><input name="rekening_nomor" value="${esc(s.rekening_nomor)}"></div><div class="field"><label>Nama Penerima QRIS</label><input name="qris_nama" value="${esc(s.qris_nama)}"></div>
    <div class="field full"><label>URL Gambar QRIS (tautan publik/Drive yang dapat diakses)</label><input type="url" name="qris_url" value="${esc(s.qris_url)}" placeholder="https://..."></div><div class="field"><label>Saldo Awal (Rp)</label><input type="number" min="0" name="saldo_awal" value="${esc(s.saldo_awal||0)}" required></div><div class="field"><label>Nama Aplikasi</label><input name="app_name" value="${esc(s.app_name||'KAS-ST | Kas Hasil Surat Tugas')}"></div></div><div class="notice">Perubahan tarif hanya memengaruhi ST baru. Nominal ST lama tetap tersimpan sesuai tarif saat dicatat.</div><button type="submit">Simpan Pengaturan</button></form></div>`}
  function usersPage(){return `${pageHead('Manajemen Pengguna','Tambah akun Admin atau Viewer dashboard')}<div class="panel"><h2>Tambah Pengguna</h2><form id="userForm" onsubmit="submitUser(event)"><div class="formgrid"><div class="field"><label>Username</label><input name="username" required minlength="3"></div><div class="field"><label>Nama Tampilan</label><input name="displayName" required></div><div class="field"><label>Peran</label><select name="role"><option value="VIEWER">Viewer — hanya lihat</option><option value="ADMIN">Admin — kelola data</option></select></div><div class="field"><label>Kata Sandi Awal (min. 10 karakter)</label><input name="password" type="password" required minlength="10"></div></div><button type="submit">Buat Pengguna</button></form></div><div class="panel"><h2>Daftar Pengguna</h2><div class="table-wrap"><table><thead><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Aktif</th><th>Ganti Sandi Awal</th></tr></thead><tbody>${data.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.displayName)}</td><td>${esc(u.role)}</td><td>${esc(u.active)}</td><td>${esc(u.mustChangePassword)}</td></tr>`).join('')}</tbody></table></div><p class="footnote">Untuk menonaktifkan akun atau mereset kata sandi, tambahkan alur administrasi sesuai kebijakan organisasi sebelum produksi.</p></div>`}
  function auditPage(){return `${pageHead('Audit Aktivitas','Riwayat perubahan dan aktivitas sistem')}<div class="panel"><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Entitas</th><th>ID</th><th>Detail</th></tr></thead><tbody>${data.audit.map(a=>`<tr><td>${esc(a.timestamp)}</td><td>${esc(a.username)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.entityId)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div></div>`}
  function passwordPage(){return `${pageHead('Ganti Kata Sandi','Gunakan kata sandi unik minimal 10 karakter')}<div class="panel"><form id="passwordForm" onsubmit="submitPassword(event)"><div class="field"><label>Kata sandi lama</label><input name="oldPassword" type="password" required></div><div class="field"><label>Kata sandi baru</label><input name="newPassword" type="password" minlength="10" required></div><div class="field"><label>Ulangi kata sandi baru</label><input name="confirmPassword" type="password" minlength="10" required></div><button type="submit">Ubah Kata Sandi</button></form></div>`}
  function formData(form){return Object.fromEntries(new FormData(form).entries())}
  async function submitST(e){e.preventDefault();try{const r=await call('saveST',token,formData(e.target));toast(r.message);await refreshData();go('sts')}catch(err){toast(err.message,'error')}}
  async function submitTx(e){e.preventDefault();try{const r=await call('saveTransaction',token,formData(e.target));toast(r.message);await refreshData();go('transactions')}catch(err){toast(err.message,'error')}}
  async function submitSettings(e){e.preventDefault();try{const r=await call('saveSettings',token,formData(e.target));toast(r.message);await refreshData();go('settings')}catch(err){toast(err.message,'error')}}
  async function submitUser(e){e.preventDefault();try{const r=await call('saveUser',token,formData(e.target));toast(r.message);await refreshData();go('users')}catch(err){toast(err.message,'error')}}
  async function submitPassword(e){e.preventDefault();const d=formData(e.target);if(d.newPassword!==d.confirmPassword){toast('Konfirmasi kata sandi tidak sama.','error');return}try{const r=await call('changePassword',token,d.oldPassword,d.newPassword);currentUser.mustChangePassword=false;toast(r.message);await refreshData();go('dashboard')}catch(err){toast(err.message,'error')}}
  async function validateTx(id,decision){const note=decision==='DITOLAK'?prompt('Alasan penolakan (wajib diisi):'):prompt('Catatan validasi (opsional):','');if(note===null)return;if(decision==='DITOLAK'&&!note.trim()){toast('Alasan penolakan wajib diisi.','error');return}try{const r=await call('validateTransaction',token,id,decision,note);toast(r.message);await refreshData()}catch(err){toast(err.message,'error')}}
  function filterTable(id,q){const table=document.getElementById(id);if(!table)return;Array.from(table.tBodies[0].rows).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
  if(token)loadApp();
</script>
</body>
</html>
