</head>

    <!-- APPLICATION SCRIPT -->
    <script>

                { id: "ST-2026-004", nomor: "ST/112/I/2026", pelaksana: "Rudi Hermawan", tanggal: "2026-01-25", pelaksanaan: "2026-01-26", uraian: "Rapat Koordinasi Balai Kota", jenis: "Dalam Kota", tarif: 10000, alokasi: 10000, metode: "BRI", ref: "TRX-88410", status: "Menunggu Verifikasi Admin", lampiran: null }

                { id: "TRX-002", tanggal: "2026-01-15", stNomor: "ST/105/I/2026", jenis: "Penerimaan", kategori: "Alokasi ST Dalam Kota", uraian: "Pencairan Kas ST/105/I/2026", masuk: 10000, keluar: 0, metode: "QRIS", ref: "QR-90112", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-003", tanggal: "2026-01-18", stNomor: "-", jenis: "Pengeluaran", kategori: "Konsumsi & Operasional", uraian: "Pembelian ATK dan Konsumsi Rapat ST", masuk: 0, keluar: 12000, metode: "Cash", ref: "KW-001", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-004", tanggal: "2026-01-22", stNomor: "ST/108/I/2026", jenis: "Penerimaan", kategori: "Alokasi ST Luar Kota", uraian: "Pencairan Kas ST/108/I/2026", masuk: 20000, keluar: 0, metode: "BRI", ref: "TRX-88390", status: "Sah", pencatat: "Admin Kas", validator: "Bendahara Utama" },
                { id: "TRX-005", tanggal: "2026-01-28", stNomor: "-", jenis: "Penerimaan", kategori: "Alokasi ST Luar Kota", uraian: "Setoran Kas ST/115/I/2026", masuk: 20000, keluar: 0, metode: "BRI", ref: "TRX-99011", status: "Menunggu Verifikasi", pencatat: "Staf ST", validator: "-" }
            ],
            reconciliations: [
                { id: "REC-001", tanggal: "2026-01-31", saldoAplikasi: 38000, saldoAktual: 38000, selisih: 0, petugas: "Admin Kas", catatan: "Sesuai dengan mutasi rekening BRI dan QRIS", status: "Match" }
            ],
            auditLogs: [
                { id: "LOG-001", timestamp: "2026-01-10 09:00", user: "System", action: "Inisialisasi Sistem", detail: "Aplikasi KAS-ST dimulai dengan tarif dasar Rp20k/10k." },
                { id: "LOG-002", timestamp: "2026-01-12 10:15", user: "Admin Kas", action: "Validasi Transaksi", detail: "Mengesahkan TRX-001 nominal Rp20.000" }
            ],
            activeView: 'dashboard'
        };

        // Load State from LocalStorage or Default
        let state = JSON.parse(localStorage.getItem('KAS_ST_APP_STATE')) || DEFAULT_STATE;
        
        // Ensure pegawaiList exists on legacy state loads
        if (!state.pegawaiList) {
            state.pegawaiList = ["Budi Santoso", "Siti Rahma", "Ahmad Dahlan", "Rudi Hermawan", "Dewi Lestari"];
        }

        function saveState() {
            localStorage.setItem('KAS_ST_APP_STATE', JSON.stringify(state));
            renderApp();
        }

        function logAudit(action, detail) {
            const newLog = {
                id: `LOG-${Date.now()}`,
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser ? `${state.currentUser.name} (${state.currentUser.role})` : 'Sistem',
                action: action,
                detail: detail
            };
            state.auditLogs.unshift(newLog);
        }

        // Helper Formatters
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        };

        // Sidebar Toggle Helper for Responsive / Mobile View
        function toggleSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) {
                sidebar.classList.toggle('-translate-x-full');
            }
            if (overlay) {
                overlay.classList.toggle('hidden');
            }
        }

        // Calculations
        function calculateFinancials() {
            const validTransactions = state.transactions.filter(t => t.status === 'Sah');
            const totalPenerimaan = validTransactions.reduce((acc, t) => acc + (t.masuk || 0), 0);
            const totalPengeluaran = validTransactions.reduce((acc, t) => acc + (t.keluar || 0), 0);
            const saldoKas = totalPenerimaan - totalPengeluaran;

            const stDalamKotaCount = state.suratTugas.filter(s => s.jenis === 'Dalam Kota').length;
            const stLuarKotaCount = state.suratTugas.filter(s => s.jenis === 'Luar Kota').length;

            const totalAlokasiST = state.suratTugas.reduce((acc, s) => acc + (s.alokasi || 0), 0);
            const pendingTxCount = state.transactions.filter(t => t.status === 'Menunggu Verifikasi').length;

            return {
                saldoKas,
                totalPenerimaan,
                totalPengeluaran,
                stDalamKotaCount,
                stLuarKotaCount,
                totalAlokasiST,
                pendingTxCount
            };
        }

        // ==========================================
        // MAIN ROUTER & RENDER ENGINE
        // ==========================================
        function renderApp() {
            const appEl = document.getElementById('app');
            
            if (!state.currentUser) {
                appEl.innerHTML = renderLoginScreen();
                if (window.lucide) lucide.createIcons();
                return;
            }

            appEl.innerHTML = `
                <div class="flex h-screen overflow-hidden bg-slate-100 relative">
                    <!-- BACKDROP OVERLAY FOR MOBILE SIDEBAR -->
                    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

                    <!-- SIDEBAR -->
                    ${renderSidebar()}

                    <!-- MAIN CONTENT AREA -->
                    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                        <!-- TOP NAVBAR -->
                        ${renderNavbar()}

                        <!-- MAIN SCROLLABLE BODY -->
                        <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50">
                            ${renderMainView()}
                        </main>
                    </div>
                </div>
            `;

            if (window.lucide) lucide.createIcons();
            initChartsIfNeeded();
        }

        // ==========================================
        // LOGIN & AUTH SCREEN
        // ==========================================
        function renderLoginScreen() {
            return `
                <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-navy-900 via-slate-900 to-navy-800 opacity-90"></div>
                    
                    <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
                        <div class="bg-navy-900 p-6 text-center text-white border-b border-gold-500/30">
                            <div class="inline-flex p-3 bg-gold-500/10 rounded-full mb-3 text-gold-400">
                                <i data-lucide="wallet" class="w-10 h-10"></i>
                            </div>
                            <h1 class="text-xl font-bold tracking-wide">SISTEM KAS-ST</h1>
                            <p class="text-xs text-slate-300 mt-1">Sistem Informasi Kas Hasil Surat Tugas</p>
                        </div>

                        <div class="p-6">
                            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email / Username</label>
                                    <input type="text" id="login-email" value="admin@kasst.go.id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-500 focus:outline-none text-sm">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                                    <input type="password" id="login-password" value="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-500 focus:outline-none text-sm">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Peran Akses (Role)</label>
                                    <select id="login-role" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-500 focus:outline-none text-sm bg-white">
                                        <option value="admin">Administrator (Akses Penuh)</option>
                                        <option value="viewer">Viewer (Pemantau Dashboard)</option>
                                    </select>
                                </div>

                                <button type="submit" class="w-full py-2.5 bg-navy-800 hover:bg-navy-900 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm flex items-center justify-center gap-2">
                                    <i data-lucide="log-in" class="w-4 h-4"></i> Masuk ke Sistem
                                </button>
                            </form>

                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <p class="text-xs text-slate-500 text-center mb-2">Login Cepat (Uji Coba):</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="quickLogin('admin')" class="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium border border-slate-300">
                                        👑 Role Admin
                                    </button>
                                    <button onclick="quickLogin('viewer')" class="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium border border-slate-300">
                                        👁️ Role Viewer
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 px-6 py-3 text-center border-t border-slate-200">
                            <p class="text-[11px] text-slate-400">© 2026 Application KAS-ST. Transparan & Akuntabel.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('login-role').value;
            const email = document.getElementById('login-email').value;
            
            state.currentUser = {
                name: role === 'admin' ? 'Administrator Kas' : 'Pemantau Publik',
                role: role,
                email: email
            };
            logAudit("Login", `Pengguna ${state.currentUser.name} login sebagai ${role}`);
            saveState();
        }

        function quickLogin(role) {
            state.currentUser = {
                name: role === 'admin' ? 'Administrator Kas' : 'Auditor Viewer',
                role: role,
                email: `${role}@kasst.go.id`
            };
            logAudit("Login Cepat", `Pengguna login cepat sebagai ${role}`);
            saveState();
        }

        function handleLogout() {
            logAudit("Logout", `Pengguna ${state.currentUser.name} keluar`);
            state.currentUser = null;
            state.activeView = 'dashboard';
            saveState();
        }

        // ==========================================
        // NAVIGATION & SIDEBAR
        // ==========================================
        function renderSidebar() {
            const isAdmin = state.currentUser.role === 'admin';

            const adminMenus = [

                { id: 'pengeluaran', label: 'Pengeluaran Kas', icon: 'arrow-up-right' },
                { id: 'buku-kas', label: 'Buku Kas', icon: 'book-open' },
                { id: 'rekonsiliasi', label: 'Rekonsiliasi Kas', icon: 'scale' },
                { id: 'laporan', label: 'Laporan Keuangan', icon: 'bar-chart-3' },
                { id: 'pengaturan-tarif', label: 'Pengaturan Tarif ST', icon: 'settings' },
                { id: 'pengaturan-bri-qris', label: 'Pengaturan BRI & QRIS', icon: 'credit-card' },
                { id: 'audit-log', label: 'Riwayat Audit Trail', icon: 'history' }
            ];

            const viewerMenus = [
                { id: 'dashboard', label: 'Dashboard Pemantauan', icon: 'layout-dashboard' },
                { id: 'master-st', label: 'Rekap Surat Tugas', icon: 'file-text' },
                { id: 'buku-kas', label: 'Arus Kas Digital', icon: 'book-open' },
                { id: 'laporan', label: 'Laporan Publik', icon: 'bar-chart-3' }
            ];

            const activeMenus = isAdmin ? adminMenus : viewerMenus;

            return `
                <aside id="app-sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-navy-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-navy-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
                    <div class="p-4 border-b border-navy-800 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-gold-500/20 text-gold-400 rounded-lg">
                                <i data-lucide="wallet" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-white text-sm tracking-wide">KAS-ST</h2>
                                <p class="text-[10px] text-slate-400 uppercase">Kas Hasil Surat Tugas</p>
                            </div>
                        </div>
                        <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1 rounded-lg">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
                        ${activeMenus.map(m => {
                            const isActive = state.activeView === m.id;
                            return `
                                <button onclick="switchView('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-medium transition ${isActive ? 'bg-gold-500 text-slate-950 font-bold shadow' : 'hover:bg-navy-800 hover:text-white text-slate-300'}">
                                    <i data-lucide="${m.icon}" class="w-4 h-4"></i>
                                    <span>${m.label}</span>
                                </button>
                            `;
                        }).join('')}
                    </nav>

                    <div class="p-3 border-t border-navy-800">
                        <div class="p-2.5 bg-navy-800/60 rounded-lg flex items-center justify-between text-xs">
                            <div class="truncate mr-2">
                                <p class="font-semibold text-white truncate">${state.currentUser.name}</p>
                                <p class="text-[10px] text-gold-400 uppercase font-mono">${state.currentUser.role}</p>
                            </div>
                            <button onclick="handleLogout()" title="Logout" class="p-1.5 hover:bg-navy-700 text-slate-400 hover:text-white rounded-md transition">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </aside>
            `;
        }

        function switchView(viewId) {
            state.activeView = viewId;
            // Tutup sidebar otomatis di layar HP setelah berpindah menu
            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('app-sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                if (sidebar) sidebar.classList.add('-translate-x-full');
                if (overlay) overlay.classList.add('hidden');
            }
            renderApp();
        }

        function renderNavbar() {
            return `
                <header class="bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition focus:outline-none" title="Buka/Tutup Menu">
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h1 class="text-sm md:text-base font-bold text-slate-800 truncate">${getViewTitle(state.activeView)}</h1>
                            <p class="text-[10px] md:text-[11px] text-slate-500 hidden sm:block">Sistem Pencatatan & Akuntabilitas Kas Surat Tugas</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 text-xs">
                        <div class="px-2.5 py-1 bg-slate-100 rounded-full border border-slate-200 text-slate-600 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span class="font-medium text-[11px] sm:text-xs">${state.currentUser.role === 'admin' ? 'Admin' : 'Viewer'}</span>
                        </div>
                    </div>
                </header>
            `;
        }

        function getViewTitle(view) {
            const titles = {
                'dashboard': 'Dashboard UTAMA Kas Surat Tugas',
                'master-st': 'Master Data Surat Tugas (ST)',
                'master-pegawai': 'Kelola Master Data Pegawai / Pelaksana',
                'penerimaan': 'Pencatatan Penerimaan Kas',
                'pengeluaran': 'Pencatatan Pengeluaran Kas',
                'buku-kas': 'Buku Kas & Arus Kas Digital',
                'rekonsiliasi': 'Rekonsiliasi Kas & Bank',
                'laporan': 'Laporan Keuangan & Cetak',
                'pengaturan-tarif': 'Pengaturan Tarif Dasar ST',
                'pengaturan-bri-qris': 'Pengaturan Metode Pembayaran',
                'audit-log': 'Riwayat Aktivitas & Audit Trail'
            };
            return titles[view] || 'Kas Surat Tugas';
        }

        // ==========================================
        // RENDER VIEWS
        // ==========================================
        function renderMainView() {
            switch (state.activeView) {
                case 'dashboard': return renderDashboardView();
                case 'master-st': return renderMasterSTView();
                case 'master-pegawai': return renderMasterPegawaiView();
                case 'penerimaan': return renderPenerimaanView();
                case 'pengeluaran': return renderPengeluaranView();
                case 'buku-kas': return renderBukuKasView();
                case 'rekonsiliasi': return renderRekonsiliasiView();
                case 'laporan': return renderLaporanView();
                case 'pengaturan-tarif': return renderPengaturanTarifView();
                case 'pengaturan-bri-qris': return renderPengaturanPaymentView();
                case 'audit-log': return renderAuditLogView();
                default: return renderDashboardView();
            }
        }

        // ------------------------------------------
        // HELPER LOGIC ST & PENERIMAAN
        // ------------------------------------------
        function updateCalculatedTarif() {
            const jenis = document.getElementById('st-jenis')?.value;
            const previewEl = document.getElementById('st-alokasi-preview');
            if (!previewEl) return;

            const nominal = jenis === 'Luar Kota' ? state.settings.tarifLuarKota : state.settings.tarifDalamKota;
            previewEl.value = formatRupiah(nominal);
        }

        function handleSaveST(e) {
            e.preventDefault();
            const nomor = document.getElementById('st-nomor').value.trim();
            const pelaksana = document.getElementById('st-pelaksana').value;
            const tanggal = document.getElementById('st-tanggal').value;
            const pelaksanaan = document.getElementById('st-pelaksanaan').value;
            const uraian = document.getElementById('st-uraian').value;
            const jenis = document.getElementById('st-jenis').value;
            const metode = document.getElementById('st-metode').value;
            const ref = document.getElementById('st-ref').value || `REF-${Math.floor(10000 + Math.random() * 90000)}`;

            const tarifNominal = jenis === 'Luar Kota' ? state.settings.tarifLuarKota : state.settings.tarifDalamKota;

            const newST = {
                id: `ST-2026-${String(state.suratTugas.length + 1).padStart(3, '0')}`,
                nomor,
                pelaksana,

        function prosesPembayaranST(stId) {
            const st = state.suratTugas.find(s => s.id === stId);
            if (!st) return;

            st.status = "Sudah Dibayar";
            
            // Verifikasi transaksi terkait
            const tx = state.transactions.find(t => t.stNomor === st.nomor);
            if (tx) {
                tx.status = "Sah";
                tx.validator = state.currentUser.name;
            }

            logAudit("Verifikasi Pembayaran ST", `Mengesahkan pembayaran ST ${st.nomor} senilai ${formatRupiah(st.alokasi)}`);
            saveState();
        }

        function verifikasiTransaksi(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;

            tx.status = "Sah";
            tx.validator = state.currentUser.name;

            // Jika transaksi terhubung dengan ST, update status ST juga
            if (tx.stNomor && tx.stNomor !== '-') {
                const st = state.suratTugas.find(s => s.nomor === tx.stNomor);
                if (st) st.status = "Sudah Dibayar";
            }

            logAudit("Sahkan Transaksi", `Mengesahkan transaksi ${tx.id} nominal ${formatRupiah(tx.masuk || tx.keluar)}`);
            saveState();
        }

        function renderBukuKasView() {
            let currentRunningBalance = 0;

            const sortedTx = [...state.transactions]
                .filter(t => t.status === 'Sah')
                .sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

            const txWithBalance = sortedTx.map(t => {
                currentRunningBalance += (t.masuk || 0) - (t.keluar || 0);
                return { ...t, runningSaldo: currentRunningBalance };
            }).reverse(); // Tampilkan yang terbaru di atas

            return `

                    <div>
                        <h3 class="text-base font-bold text-slate-800">Buku Kas & Arus Kas Digital</h3>

                                        <th class="p-3 text-right font-bold">Saldo Kas</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${txWithBalance.length > 0 ? txWithBalance.map(t => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3">${t.tanggal}</td>
                                            <td class="p-3 font-mono font-bold text-slate-700">${t.id}</td>

                                            <td class="p-3 text-right font-bold text-navy-900 bg-slate-50">${formatRupiah(t.runningSaldo)}</td>

                    </div>
                </div>
            `;

        function hapusSuratTugas(stId) {
            const st = state.suratTugas.find(s => s.id === stId);
            if (!st) return;

            if (confirm(`HAPUS DATA: Apakah Anda yakin ingin menghapus Surat Tugas ${st.nomor} (a.n ${st.pelaksana})?`)) {
                // If ST was already paid, remove associated valid transaction
                if (st.status === 'Sudah Dibayar') {
                    state.transactions = state.transactions.filter(t => t.stNomor !== st.nomor);
                }

                state.suratTugas = state.suratTugas.filter(s => s.id !== stId);
                logAudit("Hapus ST", `Menghapus Surat Tugas ${st.nomor} (${st.pelaksana})`);
                saveState();
            }
        }

        function hapusTransaksi(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;

            if (confirm(`HAPUS TRANSAKSI: Apakah Anda yakin ingin menghapus transaksi ${tx.id} - ${tx.uraian}?`)) {
                state.transactions = state.transactions.filter(t => t.id !== txId);
                logAudit("Hapus Transaksi", `Menghapus transaksi ${tx.id} (${tx.kategori}) nominal Rp${tx.masuk || tx.keluar}`);
                saveState();
            }
        }

                                <label class="block text-xs font-semibold text-slate-600 mb-1">Saldo Menurut Aplikasi</label>
                                <input type="text" readonly value="${formatRupiah(fin.saldoKas)}" class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-xs font-bold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Saldo Aktual Bank BRI / QRIS (Rp)</label>
                                <input type="number" id="rec-aktual" oninput="calculateDifference(${fin.saldoKas})" placeholder="Masukkan saldo fisik/bank..." class="w-full px-3 py-2 border rounded-lg text-xs font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Selisih Saldo</label>
                                <input type="text" id="rec-selisih" readonly value="Rp0" class="w-full px-3 py-2 bg-slate-100 border rounded-lg text-xs font-bold text-slate-700">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Hasil Pemeriksaan</label>
                                <textarea id="rec-catatan" rows="3" placeholder="Uraian penjelasan jika terdapat selisih..." class="w-full px-3 py-2 border rounded-lg text-xs"></textarea>
                            </div>
                            <button onclick="handleSaveRekonsiliasi(${fin.saldoKas})" class="w-full py-2.5 bg-navy-800 text-white font-semibold rounded-lg text-xs hover:bg-navy-900">
                                Simpan Berita Acara Rekonsiliasi
                            </button>
                        </div>

                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <h4 class="text-sm font-bold text-slate-800 mb-3">Riwayat Rekonsiliasi</h4>
                            <div class="space-y-3">
                                ${state.reconciliations.map(r => `
                                    <div class="p-3 border rounded-lg bg-slate-50 text-xs space-y-1">
                                        <div class="flex justify-between items-center font-bold">
                                            <span>${r.tanggal}</span>
                                            <span class="px-2 py-0.5 rounded text-[10px] ${r.selisih === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${r.status}</span>
                                        </div>
                                        <p class="text-slate-600">Saldo App: ${formatRupiah(r.saldoAplikasi)} | Saldo Aktual: ${formatRupiah(r.saldoAktual)}</p>
                                        <p class="text-slate-500 italic">"${r.catatan}"</p>
                                        <p class="text-[10px] text-slate-400">Pemeriksa: ${r.petugas}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function calculateDifference(saldoApp) {
            const val = parseFloat(document.getElementById('rec-aktual').value) || 0;
            const selisih = val - saldoApp;
            document.getElementById('rec-selisih').value = formatRupiah(selisih);
        }

        function handleSaveRekonsiliasi(saldoApp) {
            const aktual = parseFloat(document.getElementById('rec-aktual').value);
            if (isNaN(aktual)) {
                alert("Masukkan nominal saldo aktual!");
                return;
            }
            const selisih = aktual - saldoApp;
            const newRec = {
                id: `REC-${Date.now()}`,
                tanggal: new Date().toISOString().split('T')[0],
                saldoAplikasi: saldoApp,
                saldoAktual: aktual,
                selisih: selisih,
                petugas: state.currentUser.name,
                catatan: document.getElementById('rec-catatan').value || "Rekonsiliasi Rutin",
                status: selisih === 0 ? "Match" : "Selisih"
            };

            state.reconciliations.unshift(newRec);
            logAudit("Rekonsiliasi Kas", `Melakukan rekonsiliasi kas: Saldo App ${saldoApp}, Saldo Aktual ${aktual}`);
            saveState();
        }

        // ------------------------------------------
        // 7. LAPORAN VIEW
        // ------------------------------------------
        function renderLaporanView() {
            const fin = calculateFinancials();

            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800">Laporan Keuangan Kas Surat Tugas</h3>
                                <p class="text-xs text-slate-500">Periode Berjalan: Tahun 2026</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="exportCSV()" class="px-3 py-2 bg-emerald-600 text-white rounded text-xs font-semibold hover:bg-emerald-700 flex items-center gap-1.5">
                                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Ekspor CSV / Excel
                                </button>
                                <button onclick="window.print()" class="px-3 py-2 bg-navy-800 text-white rounded text-xs font-semibold hover:bg-navy-900 flex items-center gap-1.5">
                                    <i data-lucide="printer" class="w-4 h-4"></i> Cetak Laporan PDF
                                </button>
                            </div>
                        </div>

                        <!-- REPORT SUMMARY BOXES -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                            <div>
                                <span class="text-slate-500">Total ST Dalam Kota:</span>
                                <p class="font-bold text-slate-800 text-sm">${fin.stDalamKotaCount} ST</p>
                            </div>
                            <div>
                                <span class="text-slate-500">Total ST Luar Kota:</span>
                                <p class="font-bold text-slate-800 text-sm">${fin.stLuarKotaCount} ST</p>
                            </div>
                            <div>
                                <span class="text-slate-500">Total Penerimaan:</span>
                                <p class="font-bold text-emerald-600 text-sm">${formatRupiah(fin.totalPenerimaan)}</p>
                            </div>
                            <div>
                                <span class="text-slate-500">Total Pengeluaran:</span>
                                <p class="font-bold text-rose-600 text-sm">${formatRupiah(fin.totalPengeluaran)}</p>
                            </div>
                        </div>

                        <!-- DETAILED REPORT TABLE -->
                        <div class="overflow-x-auto pt-2">
                            <h4 class="text-xs font-bold uppercase text-slate-500 mb-2">Rincian Laporan Arus Kas</h4>
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-200 text-slate-700 uppercase font-bold">
                                        <th class="p-2 border">No</th>
                                        <th class="p-2 border">Tanggal</th>
                                        <th class="p-2 border">Kategori</th>
                                        <th class="p-2 border">Uraian Transaksi</th>
                                        <th class="p-2 border text-right">Debit (Rp)</th>
                                        <th class="p-2 border text-right">Kredit (Rp)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.transactions.filter(t => t.status === 'Sah').map((t, idx) => `
                                        <tr>
                                            <td class="p-2 border">${idx + 1}</td>
                                            <td class="p-2 border">${t.tanggal}</td>
                                            <td class="p-2 border font-semibold">${t.kategori}</td>
                                            <td class="p-2 border">${t.uraian}</td>
                                            <td class="p-2 border text-right">${t.masuk > 0 ? formatRupiah(t.masuk) : '-'}</td>
                                            <td class="p-2 border text-right">${t.keluar > 0 ? formatRupiah(t.keluar) : '-'}</td>
                                        </tr>
                                    `).join('')}
                                    <tr class="bg-slate-100 font-bold">
                                        <td colspan="4" class="p-2 border text-right uppercase">Total & Saldo Akhir Kas:</td>
                                        <td class="p-2 border text-right text-emerald-600">${formatRupiah(fin.totalPenerimaan)}</td>
                                        <td class="p-2 border text-right text-rose-600">${formatRupiah(fin.totalPengeluaran)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportCSV() {
            let csv = "ID,Tanggal,Nomor ST,Kategori,Uraian,Masuk,Keluar,Metode,Status\n";
            state.transactions.forEach(t => {
                csv += `"${t.id}","${t.tanggal}","${t.stNomor}","${t.kategori}","${t.uraian}",${t.masuk},${t.keluar},"${t.metode}","${t.status}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Laporan_Kas_ST_${new Date().toISOString().split('T')[0]}.csv`);
            a.click();
        }

        // ------------------------------------------
        // 8. PENGATURAN TARIF VIEW (ADMIN)
        // ------------------------------------------
        function renderPengaturanTarifView() {
            return `
                <div class="space-y-6 max-w-2xl">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-800 border-b pb-2">Pengaturan Tarif Kas Surat Tugas</h3>
                        <p class="text-xs text-slate-500">Perubahan tarif hanya berlaku sesuai tanggal efektif dan tidak mengubah data historis.</p>

                        <form onsubmit="handleSaveTarif(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tarif ST Luar Kota (Rp)</label>
                                <input type="number" id="cfg-luar" value="${state.settings.tarifLuarKota}" required class="w-full px-3 py-2 border rounded-lg text-xs font-bold text-navy-800">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tarif ST Dalam Kota (Rp)</label>
                                <input type="number" id="cfg-dalam" value="${state.settings.tarifDalamKota}" required class="w-full px-3 py-2 border rounded-lg text-xs font-bold text-navy-800">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Efektif Berlaku</label>
                                <input type="date" id="cfg-date" value="${state.settings.effectiveDate}" required class="w-full px-3 py-2 border rounded-lg text-xs">
                            </div>

                            <button type="submit" class="px-4 py-2.5 bg-navy-800 text-white rounded-lg text-xs font-semibold hover:bg-navy-900 shadow">
                                Simpan Kebijakan Tarif Baru
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleSaveTarif(e) {
            e.preventDefault();
            state.settings.tarifLuarKota = parseFloat(document.getElementById('cfg-luar').value);
            state.settings.tarifDalamKota = parseFloat(document.getElementById('cfg-dalam').value);
            state.settings.effectiveDate = document.getElementById('cfg-date').value;

            logAudit("Ubah Tarif ST", `Mengubah tarif dasar: Luar Kota=${state.settings.tarifLuarKota}, Dalam Kota=${state.settings.tarifDalamKota}`);
            alert("Pengaturan tarif dasar berhasil diperbarui!");
            saveState();
        }

        // ------------------------------------------
        // 9. PENGATURAN BRI & QRIS VIEW (ADMIN)
        // ------------------------------------------
        function renderPengaturanPaymentView() {
            return `
                <div class="space-y-6 max-w-2xl">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-800 border-b pb-2">Konfigurasi Rekening BRI & QRIS</h3>

                        <form onsubmit="handleSavePayment(event)" class="space-y-4">
                            <h4 class="text-xs font-bold uppercase text-navy-800">1. Rekening BRI Official</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pemilik Rekening</label>
                                    <input type="text" id="cfg-bri-name" value="${state.settings.briAccountName}" class="w-full px-3 py-2 border rounded-lg text-xs">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor Rekening BRI</label>
                                    <input type="text" id="cfg-bri-num" value="${state.settings.briAccountNumber}" class="w-full px-3 py-2 border rounded-lg text-xs font-mono">
                                </div>
                            </div>

                            <h4 class="text-xs font-bold uppercase text-navy-800 pt-3 border-t">2. QRIS Official</h4>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Merchant QRIS</label>
                                <input type="text" id="cfg-qris-merchant" value="${state.settings.qrisMerchant}" class="w-full px-3 py-2 border rounded-lg text-xs">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Gambar QRIS Code (PNG/JPG)</label>
                                <input type="file" id="cfg-qris-file" accept="image/*" onchange="previewQRISUpload(event)" class="w-full text-xs text-slate-500 border rounded-lg p-2 bg-slate-50">
                            </div>

                            <!-- PREVIEW AREA -->
                            <div class="p-3 border rounded-lg bg-slate-50 text-center">
                                <span class="text-[10px] text-slate-400 font-bold uppercase block mb-2">Gambar QRIS Aktif</span>
                                <img id="qris-preview-img" src="${state.settings.qrisImageUrl}" alt="QRIS Preview" class="w-40 h-40 mx-auto rounded-lg border object-cover shadow-sm">
                            </div>

                            <button type="submit" class="px-4 py-2.5 bg-navy-800 text-white rounded-lg text-xs font-semibold hover:bg-navy-900 shadow">
                                Simpan Informasi Pembayaran
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        let uploadedQrisDataUrl = null;

        function previewQRISUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedQrisDataUrl = event.target.result;
                    document.getElementById('qris-preview-img').src = uploadedQrisDataUrl;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleSavePayment(e) {
            e.preventDefault();
            state.settings.briAccountName = document.getElementById('cfg-bri-name').value;
            state.settings.briAccountNumber = document.getElementById('cfg-bri-num').value;
            state.settings.qrisMerchant = document.getElementById('cfg-qris-merchant').value;

            if (uploadedQrisDataUrl) {
                state.settings.qrisImageUrl = uploadedQrisDataUrl;
            }

            logAudit("Ubah Payment Config", "Memperbarui info rekening BRI dan mengunggah gambar QRIS baru.");
            alert("Konfigurasi pembayaran dan gambar QRIS berhasil diperbarui!");
            saveState();
        }

        // ------------------------------------------
        // 10. AUDIT LOG VIEW (ADMIN)
        // ------------------------------------------
        function renderAuditLogView() {
            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-800">Riwayat Audit Trail & Jejak Aktivitas</h3>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-100 text-slate-600 uppercase font-semibold border-b">
                                        <th class="p-3">Waktu Log</th>
                                        <th class="p-3">Pengguna</th>
                                        <th class="p-3">Aksi</th>
                                        <th class="p-3">Detail Perubahan</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${state.auditLogs.map(l => `
                                        <tr>
                                            <td class="p-3 font-mono text-slate-500">${l.timestamp}</td>
                                            <td class="p-3 font-bold text-slate-800">${l.user}</td>
                                            <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 rounded text-[10px] font-semibold">${l.action}</span></td>
                                            <td class="p-3 text-slate-600">${l.detail}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // MODAL CLOSE HELPER
        function closeModal() {
            const modalContainer = document.getElementById('modal-container');
            if (modalContainer) {
                modalContainer.innerHTML = '';
            }
        }

        // INITIAL APP LAUNCH
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
